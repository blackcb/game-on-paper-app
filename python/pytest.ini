[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: hits the live ESPN API; deselected by default
filterwarnings =
    # sportsdataverse uses pandas APIs deprecated in pandas 4.x. Not our
    # bug to fix; suppress so our test output stays readable.
    ignore::pandas.errors.Pandas4Warning
    ignore::pandas.errors.PerformanceWarning
