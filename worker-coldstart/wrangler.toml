# Throwaway test Worker for Phase 3A cold-start measurement.
# Delete this directory after the cold-start data is captured.

name = "gop-coldstart-test"
main = "src/index.ts"
account_id = "ebe521cb5b561683303b77d32e240ba4"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat"]

# Container binding pointing at the image we pushed in 3A.2.
# `registry.cloudflare.com/<account-id>/<image>:<tag>` is the
# wrangler-containers-push tag pattern.
[[containers]]
class_name = "PythonContainer"
image = "registry.cloudflare.com/ebe521cb5b561683303b77d32e240ba4/gop-python:slim"
max_instances = 1
instance_type = "standard-2"
# Pin to North American regions. Lisbon placement on the previous run
# added cross-Atlantic round-trip on every container hop. ENAM + WNAM
# lets the scheduler pick the closer of the two for a given request.
constraints = { regions = ["ENAM", "WNAM"] }

# Container is a Durable Object subclass — DO binding is what the
# Worker code reaches via env.PYTHON_CONTAINER.
[[durable_objects.bindings]]
name = "PYTHON_CONTAINER"
class_name = "PythonContainer"

# DOs need a migration to be created the first time.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PythonContainer"]
