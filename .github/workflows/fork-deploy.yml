# Fork-only CI gate. Runs pytest + schema-freshness check on every
# push to the deploy branch.
#
# History: this workflow used to build four docker images (node, python,
# redis, cache), push to GHCR, SSH to the DigitalOcean droplet, and run
# docker-compose. That entire pipeline went away on 2026-05-11 with the
# Architecture B follow-up that retired the droplet — python.unseen-university.org
# now resolves to a Worker route that service-binds to the Cloudflare
# Container, and the Container image is built+pushed manually with
# `wrangler containers push` followed by `wrangler deploy`. There's no
# droplet to deploy to anymore.
#
# What's left: python-test, because that's still a useful gate before
# `wrangler containers push`. The legacy build/deploy/e2e/lighthouse
# jobs are preserved in git history at commit 572dd2e6's parent if you
# ever need to dig them up. Don't propagate this workflow to upstream.

name: fork-deploy

on:
  push:
    branches: [instrument-plus-cloudflare-cdn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    # Pytest + schema-freshness check. A regression here should block
    # a manual `wrangler containers push` — but nothing automated
    # enforces that; the gate is operator discipline.
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (xgboost dep on Linux)
        run: |
          apt-get update -qq
          apt-get install -y -qq libgomp1

      - name: Install Python deps
        run: pip install -q -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        # Mirror failures to GITHUB_STEP_SUMMARY so debugging is possible
        # from the public run page without log-access perms.
        run: |
          set -o pipefail
          {
            echo '## pytest output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pytest -m "not integration" -v 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Verify committed JSON Schema is up to date
        # Regenerates the schema in-process and fails if either committed
        # copy drifted. Catches the "edited schemas.py but forgot to dump"
        # mistake at push time instead of in production.
        run: |
          python -c "
          import sys
          from pathlib import Path
          from schemas import _dump_schema

          expected = _dump_schema()
          targets = [
              '../shared/process-response.schema.json',
              '../frontend/cfb/process-response.schema.json',
          ]
          drifted = []
          for path in targets:
              if not Path(path).exists():
                  # frontend/ may be deleted post-droplet-retirement;
                  # tolerate missing copies.
                  continue
              committed = Path(path).read_text(encoding='utf-8')
              if committed != expected:
                  drifted.append(path)

          if drifted:
              for p in drifted:
                  print(f'::error file={p}::JSON Schema drifted from schemas.py output')
              print()
              print('Run \`python scripts/dump_schema.py\` from python/ and commit the result.')
              sys.exit(1)
          print(f'schema files up to date ({len(expected)} bytes each)')
          "
