# Fork-only deploy pipeline. Builds the four containers, pushes to the
# fork's GHCR namespace, and deploys to sports.unseen-university.org.
#
# Do not propagate this workflow to the upstream PR.
# See docs/replica-deploy-plan.md Phase D for setup details.

name: fork-deploy

on:
  push:
    branches: [instrument-plus-cloudflare-cdn]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  python-test:
    # Pytest + schema-freshness check. Runs in parallel with the image
    # builds so it doesn't add to the critical path. Deploy waits on
    # both this and `build` so a Python regression blocks the rollout.
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (xgboost dep on Linux)
        run: |
          apt-get update -qq
          apt-get install -y -qq libgomp1

      - name: Install Python deps
        run: pip install -q -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        # Mirror failures to GITHUB_STEP_SUMMARY so debugging is possible
        # from the public run page without log-access perms.
        run: |
          set -o pipefail
          {
            echo '## pytest output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pytest -m "not integration" -v 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Verify committed JSON Schema is up to date
        # Regenerates the schema in-process and fails if either committed
        # copy drifted. Catches the "edited schemas.py but forgot to dump"
        # mistake at push time instead of in production.
        # Pure-Python compare (no `git diff`) because python:3.14-slim
        # doesn't ship git and we don't want to bloat the container image
        # for a 3-line diff check.
        run: |
          python -c "
          import sys
          from pathlib import Path
          from schemas import _dump_schema

          expected = _dump_schema()
          targets = [
              '../shared/process-response.schema.json',
              '../frontend/cfb/process-response.schema.json',
          ]
          drifted = []
          for path in targets:
              committed = Path(path).read_text(encoding='utf-8')
              if committed != expected:
                  drifted.append(path)

          if drifted:
              for p in drifted:
                  print(f'::error file={p}::JSON Schema drifted from schemas.py output')
              print()
              print('Run \`python scripts/dump_schema.py\` from python/ and commit the result.')
              sys.exit(1)
          print(f'schema files up to date ({len(expected)} bytes each)')
          "

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: python
            context: ./python
            dockerfile: ./python/Dockerfile
          - name: redis
            context: ./redis
            dockerfile: ./redis/Dockerfile.lru
          - name: cache
            context: ./redis
            dockerfile: ./redis/Dockerfile.cache
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/game-on-paper-experiment/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Wait on both the image builds and the python-test job. A pytest
    # failure or schema drift will block the rollout.
    needs: [build, python-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: docker-compose.fork.yml
          target: /home/deploy/
          overwrite: true

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd /home/deploy
            mv -f docker-compose.fork.yml docker-compose.yml
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      # Sub-phase 2H: ship the Caddy snippet that exposes Python at
      # https://python.sports.unseen-university.org for the Cloudflare Worker.
      # Only runs after the docker compose deploy succeeds — Caddy
      # `reverse_proxy python:7000` would 502 if Python isn't up.
      #
      # One-time droplet setup required before this step works:
      #   sudo mkdir -p /etc/caddy/conf.d
      #   sudo grep -q 'import conf.d' /etc/caddy/Caddyfile \
      #     || echo 'import /etc/caddy/conf.d/*.caddy' \
      #        | sudo tee -a /etc/caddy/Caddyfile
      #   sudo systemctl reload caddy
      # Plus the deploy user needs passwordless sudo for `install`,
      # `caddy validate`, and `systemctl reload caddy`.
      - name: Stage Caddy snippets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: caddy/*.caddy
          target: /tmp/caddy-stage/
          overwrite: true
          strip_components: 1

      - name: Render + install Caddy snippets, reload Caddy
        uses: appleboy/ssh-action@v1.2.0
        env:
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # appleboy/ssh-action only forwards env vars listed here.
          envs: WORKER_SHARED_SECRET
          script: |
            set -e
            if [ -z "${WORKER_SHARED_SECRET}" ]; then
              echo "::error::WORKER_SHARED_SECRET GitHub Actions secret is empty or unset"
              exit 1
            fi
            # Self-heal the one-time droplet setup so a fresh
            # provision (replica-deploy-plan.md Phase A → push
            # this branch) doesn't require manual SSH for the
            # 2H bring-up. Idempotent: mkdir -p is a no-op if
            # the dir exists; the sed removes any existing
            # `import .*conf.d` lines (handles the prior
            # `grep -q 'import conf.d'` bug that left
            # duplicates) and the tee re-adds exactly one.
            # Net effect on a healthy config: still exactly one
            # import line. Net effect on a broken config:
            # collapsed back to one line. Net effect on a
            # virgin droplet: import line is added.
            sudo mkdir -p /etc/caddy/conf.d
            sudo sed -i -E '/^import[[:space:]]+\/etc\/caddy\/conf\.d\/\*\.caddy$/d' \
              /etc/caddy/Caddyfile
            echo 'import /etc/caddy/conf.d/*.caddy' \
              | sudo tee -a /etc/caddy/Caddyfile > /dev/null
            for src in /tmp/caddy-stage/*.caddy; do
              name=$(basename "$src")
              # envsubst rendered as the deploy user; sudo install
              # only does the file move so the secret never appears
              # on a sudo command line. install with mode 0640 so
              # only root + the caddy group can read the rendered
              # config.
              tmp_out=$(mktemp)
              envsubst < "$src" > "$tmp_out"
              sudo install -o root -g caddy -m 0640 "$tmp_out" \
                "/etc/caddy/conf.d/$name"
              rm -f "$tmp_out"
            done
            sudo caddy validate --config /etc/caddy/Caddyfile
            sudo systemctl reload caddy
            rm -rf /tmp/caddy-stage

  e2e:
    # Run Playwright after deploy completes so we test what was just rolled
    # out. Inlined here rather than in e2e.yml because workflow_run only
    # fires from workflows on the default branch (the fork's main is
    # intentionally aligned with upstream, so e2e.yml on dev never fires
    # workflow_run). e2e.yml still exists for the nightly cron + manual
    # dispatch paths.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          BASE_URL: https://sports.unseen-university.org
        run: npx playwright test

      - name: Upload Playwright report
        # Upload on both pass and fail (skip cancelled runs which would
        # have a partial report). Lets you inspect timings + traces +
        # screenshots even when tests were green — useful for tracking
        # how close each test is to its budget.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  lighthouse:
    # Runs after e2e — deployed code has already been smoke-tested by
    # Playwright by the time Lighthouse measures it. lhci scores are
    # warn-only by default with a single error-level floor at perf=0.40
    # (see frontend/lighthouserc.json); won't block deploy in practice
    # but produces a public report URL for every run.
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          set -o pipefail
          {
            echo '## lighthouse output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npx lhci autorun 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload Lighthouse artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/
          retention-days: 14
