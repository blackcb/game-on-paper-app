name: test

on:
  push:
  pull_request:

# Cancel in-progress runs for the same ref so a fast follow-up push doesn't
# pile up. Saves Actions minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements*.txt

      - name: Install OpenMP runtime (xgboost dep on Linux)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python deps
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest (snapshot tests + others, integration deselected)
        # Capture pytest output to the run summary so failures are
        # debuggable from the public run page without log-access perms.
        run: |
          set -o pipefail
          {
            echo '## pytest output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pytest -m "not integration" -v 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc
