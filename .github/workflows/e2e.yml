name: e2e

# Per-push E2E lives in fork-deploy.yml as a `needs: deploy` job — that
# was the simplest way to get post-deploy ordering, since `workflow_run`
# only fires from workflows on the default branch and the fork's main is
# intentionally tracking upstream.
#
# This file covers the two paths fork-deploy.yml doesn't:
#   1. Daily at 14:30 UTC (catches drift even when no deploys happened).
#   2. Manual dispatch (re-run on demand without pushing).
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          BASE_URL: https://sports.unseen-university.org
        run: npx playwright test

      - name: Upload Playwright report
        # Upload on both pass and fail (skip cancelled runs).
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
