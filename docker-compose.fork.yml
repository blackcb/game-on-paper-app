# Fork-specific compose file for sports.unseen-university.org. Mirrors
# docker-compose.do.yml but pulls images from blackcb/game-on-paper-experiment
# instead of saiemgilani/saiemgilani/game-on-paper.
#
# Do not commit to the upstream PR — fork-only file.
services:
  redis:
    image: ghcr.io/blackcb/game-on-paper-experiment/redis:latest
    expose:
      - 6379
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1gb
  cache:
    image: ghcr.io/blackcb/game-on-paper-experiment/cache:latest
    expose:
      - 6380
    # cache instance listens on 6380 (redis/cache.conf), not the redis-cli
    # default 6379 — upstream's healthcheck `redis-cli ping` is wrong.
    healthcheck:
      test: redis-cli -p 6380 ping || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1gb
  summary:
    image: ghcr.io/akeaswaran/akeaswaran/cfb-team-summaries:latest
    expose:
      - 3000
    healthcheck:
      test: curl --fail http://summary:3000/health || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1gb
  node:
    image: ghcr.io/blackcb/game-on-paper-experiment/node:latest
    command: ["node", "server.js"]
    environment:
      RDATA_BASE_URL: "http://python:7000"
      NODE_ENV: production
    ports:
      - 8000:8000
    # depends_on with `service_healthy` instead of the short form: node's
    # /cfb/healthcheck route calls axios.get to python without try/catch
    # (games.js:219), so if python isn't ready when docker fires node's
    # healthcheck, the unhandled rejection terminates node (Node 24+).
    # Gating on python's health avoids the race; restart policy covers
    # the residual case of any service flapping.
    depends_on:
      python:
        condition: service_healthy
      summary:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache:
        condition: service_healthy
    links:
      - python
      - summary
      - redis
      - cache
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:8000/cfb/healthcheck || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1gb
  python:
    image: ghcr.io/blackcb/game-on-paper-experiment/python:latest
    expose:
      - 7000
    healthcheck:
      test: curl --fail http://python:7000/healthcheck || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 4gb
