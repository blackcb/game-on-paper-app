# Per-game PBP cache. 1 GB ceiling, ~60s TTL on each entry, write-heavy.
#
# `maxmemory-policy allkeys-lru` matches the LRU instance's policy in
# lru.conf — without it (the original config), redis defaulted to
# `noeviction` and would refuse new writes once it reached `maxmemory`.
# A burst of unique games during a Saturday slate could fill 1 GB
# of cache entries faster than the 60s TTL evicted them; once full,
# subsequent /cfb/process responses would fail to write to cache,
# defeating the whole point of the layer.
#
# allkeys-lru evicts the least-recently-used key whenever a write would
# exceed maxmemory, regardless of TTL. That's the right behavior for a
# pure cache: the data is reproducible by re-running the pipeline, so
# losing the coldest entry is cheap.
maxmemory 1000mb
maxmemory-policy allkeys-lru
port 6380
