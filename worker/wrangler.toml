# Cloudflare Worker config for the Phase 2 rewrite of the Express+EJS
# frontend. Bindings (KV namespaces, container, secrets) get added as
# we port routes — this is intentionally minimal for sub-phase 2A.
#
# Worker name `sports` so the *.workers.dev URL reads
# `sports.unseen-university.workers.dev`, mirroring the production
# hostname `sports.unseen-university.org`. The fork's GHCR image
# namespace (`game-on-paper-experiment`) is unaffected — that's
# Docker-side, this is the Cloudflare-side identifier.
name = "sports"
main = "src/index.tsx"
# Chris Black's personal account (the one hosting unseen-university.org).
account_id = "ebe521cb5b561683303b77d32e240ba4"
# 2026-05-02: today's date. Bumping this opts into newer Workers
# runtime semantics; do it deliberately, not as a refactor side effect.
compatibility_date = "2026-05-02"
# Required by some npm packages (axios used Node built-ins; the port
# replaces axios with fetch but the flag is cheap to keep on for any
# helper that still touches a Node-only API).
compatibility_flags = ["nodejs_compat"]

# Local dev defaults. `wrangler dev` listens on 8787 by default; pin
# it so the Playwright suite (perf-plan Day 3) can target a known
# port without env wiring.
[dev]
port = 8787

# Sub-phase 2E: Workers Static Assets binding. Files in ./public are
# served at their relative paths (e.g. ./public/assets/js/dashboard.js
# → /assets/js/dashboard.js). Default routing matches assets first and
# falls through to the Worker handler on misses, so the dynamic
# /cfb/* routes are unaffected. No `binding` because the Worker never
# needs to call env.ASSETS.fetch — the runtime handles asset matching
# transparently.
#
# Source of truth lives at frontend/public/ during the migration; this
# directory is a copy. After Phase 3E (droplet decommission) the
# legacy frontend/public can go away and this becomes the only copy.
[assets]
directory = "./public"

# KV bindings — replace the LRU Redis instance (port 6379 in the
# Express stack) with two namespaces:
#   - LEAGUE_DATA: bulk league/team summary cache. Keys like
#     `${year}-${type}` (3-day TTL via expirationTtl on writes).
#   - SUMMARY_LAST_UPDATED: small, isolated namespace so list
#     operations on the bulk data namespace stay fast.
# IDs are namespace-stable; rotating them would orphan all cached
# data, so update in place if the binding name ever changes.
[[kv_namespaces]]
binding = "LEAGUE_DATA"
id = "649602a55c7048c5ba433bdece6ba731"

[[kv_namespaces]]
binding = "SUMMARY_LAST_UPDATED"
id = "564be97a4ca8419a9ccdc8b0be0f1c3d"

# Python service URL for /cfb/process. In production this points at
# the droplet's Python container; sub-phase 3B replaces it with a
# Container binding (`env.PBP_PROCESSOR.fetch(...)`) and this var
# goes away. Default value here is the Express stack's internal
# URL — safe because wrangler dev never reaches it; production sets
# this via `wrangler secret put PYTHON_BASE_URL`.
[vars]
PYTHON_BASE_URL = "http://python:7000"
