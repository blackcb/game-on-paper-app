# Cloudflare Worker config for the Phase 2 rewrite of the Express+EJS
# frontend. Bindings (KV namespaces, container, secrets) get added as
# we port routes — this is intentionally minimal for sub-phase 2A.
#
# Worker name `sports` so the *.workers.dev URL reads
# `sports.unseen-university.workers.dev`, mirroring the production
# hostname `sports.unseen-university.org`. The fork's GHCR image
# namespace (`game-on-paper-experiment`) is unaffected — that's
# Docker-side, this is the Cloudflare-side identifier.
name = "sports"
main = "src/index.tsx"
# Chris Black's personal account (the one hosting unseen-university.org).
account_id = "ebe521cb5b561683303b77d32e240ba4"
# 2026-05-02: today's date. Bumping this opts into newer Workers
# runtime semantics; do it deliberately, not as a refactor side effect.
compatibility_date = "2026-05-02"
# Required by some npm packages (axios used Node built-ins; the port
# replaces axios with fetch but the flag is cheap to keep on for any
# helper that still touches a Node-only API).
compatibility_flags = ["nodejs_compat"]

# Local dev defaults. `wrangler dev` listens on 8787 by default; pin
# it so the Playwright suite (perf-plan Day 3) can target a known
# port without env wiring.
[dev]
port = 8787

# Sub-phase 2F: Cron-warmed scoreboard. Fires the `scheduled`
# handler in src/index.tsx once a minute. The handler itself
# checks `isFootballSeason()` and short-circuits in the off-season,
# so the wall-clock cron rate is always once-a-minute but the
# in-season cost is roughly 5 months × 30d × 24h × 60min ≈ 215k
# executions/year (well within the Workers Paid plan's allowance).
#
# Tune to ["*/2 * * * *"] (every 2 minutes) if cron quota becomes
# a concern. The KV key has a 3-minute TTL so a 2-minute cadence
# still keeps the cache warm; it just gives less margin against
# cron failures.
[triggers]
crons = ["* * * * *"]

# Sub-phase 2E: Workers Static Assets binding. Files in ./public are
# served at their relative paths (e.g. ./public/assets/js/dashboard.js
# → /assets/js/dashboard.js). Default routing matches assets first and
# falls through to the Worker handler on misses, so the dynamic
# /cfb/* routes are unaffected. No `binding` because the Worker never
# needs to call env.ASSETS.fetch — the runtime handles asset matching
# transparently.
#
# Source of truth lives at frontend/public/ during the migration; this
# directory is a copy. After Phase 3E (droplet decommission) the
# legacy frontend/public can go away and this becomes the only copy.
[assets]
directory = "./public"

# KV bindings — replace the LRU Redis instance (port 6379 in the
# Express stack) with two namespaces:
#   - LEAGUE_DATA: bulk league/team summary cache. Keys like
#     `${year}-${type}` (3-day TTL via expirationTtl on writes).
#   - SUMMARY_LAST_UPDATED: small, isolated namespace so list
#     operations on the bulk data namespace stay fast.
# IDs are namespace-stable; rotating them would orphan all cached
# data, so update in place if the binding name ever changes.
[[kv_namespaces]]
binding = "LEAGUE_DATA"
id = "649602a55c7048c5ba433bdece6ba731"

[[kv_namespaces]]
binding = "SUMMARY_LAST_UPDATED"
id = "564be97a4ca8419a9ccdc8b0be0f1c3d"

# Python service URL for /cfb/process. Sub-phase 2H exposes Python
# publicly via Caddy on the droplet at https://python.unseen-university.org,
# gated on a shared-secret header (X-Worker-Secret) the Worker
# sends from c.env.WORKER_SHARED_SECRET. The secret itself lives
# outside this file — set via `wrangler secret put WORKER_SHARED_SECRET`
# so it doesn't end up in git.
#
# Sub-phase 3B replaces this URL + secret with a Cloudflare
# Container binding (`env.PBP_PROCESSOR.fetch(...)`); both go away
# when that lands.
#
# For local dev against a host-network Python container, override
# in worker/.dev.vars (gitignored):
#   PYTHON_BASE_URL=http://localhost:7000
# Inside Docker on the droplet the legacy frontend keeps using the
# Docker-internal http://python:7000 — that's not this Worker's
# concern, that's the Express stack's own config.
# Workers Logs: persists structured-JSON console.log output to the
# CF dashboard's Logs tab (Workers & Pages → sports → Logs). Lets
# operators filter/search by `event` field instead of tailing a
# stream. 1.0 head_sampling_rate = 100% of invocations are logged
# — fine at this site's request volume; revisit if billing pressure
# ever shows up.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
PYTHON_BASE_URL = "https://python.unseen-university.org"
# Sub-phase 2H follow-up (2026-05-03): same pattern as PYTHON_BASE_URL,
# but for the cfb-team-summaries container (used by leaderboards,
# trends, EPA chart, team pages, and pregame matchup percentiles).
# Caddy on the droplet fronts the summary container at this URL with
# the same X-Worker-Secret gate.
SUMMARY_BASE_URL = "https://summary.unseen-university.org"
# Sub-phase 3B backend toggle. lib/backends.ts reads these to pick
# the per-request transport. Cut over from "droplet" to "container"
# in 3D (2026-05-08). See worker/SEASON-MODES.md.
PYTHON_BACKEND = "container"
SUMMARY_BACKEND = "container"
# 3B sleepAfter driver (read by Container subclass in src/containers.ts).
# This file is the "normal" weekday-in-season profile.
SEASON_MODE = "normal"
# 3C cron-warm gates (Layers B + C). `normal` keeps Layer B
# (healthcheck warm) on, Layer C (per-game pre-warm) off — Wednesday
# nights have one MAC midweek game, pre-warming 10 of them is waste.
# Bumped to "1" alongside the 3D cutover so weekday-deployed-on-Sat
# fallback works without a separate flip.
CRON_WARM_ENABLED = "1"
PREWARM_TOP_N = "0"
# Layer C self-fetch target. The Worker is bound to this hostname via
# Cloudflare Routes; cron-fired prewarms hit it from inside the
# Worker so the response lands in caches.default at the cron-firing
# PoP.
PREWARM_BASE_URL = "https://sports.unseen-university.org"

# Sub-phase 3B: Cloudflare Container bindings. The Container DO
# subclasses are exported from src/index.tsx (re-exported from
# src/containers.ts). `instance_type = "standard-2"` and
# `constraints.regions` were chosen in 3A.7 measurements; image
# tags (`gop-python:slim`, `gop-summary:slim`) come from 3A.6 / 3A.6b.
[[containers]]
class_name = "PythonContainer"
image = "registry.cloudflare.com/ebe521cb5b561683303b77d32e240ba4/gop-python:slim"
max_instances = 5
instance_type = "standard-2"
constraints = { regions = ["ENAM", "WNAM"] }

[[containers]]
class_name = "SummaryContainer"
image = "registry.cloudflare.com/ebe521cb5b561683303b77d32e240ba4/gop-summary:slim"
max_instances = 3
instance_type = "standard-2"
constraints = { regions = ["ENAM", "WNAM"] }

[[durable_objects.bindings]]
name = "PYTHON_CONTAINER"
class_name = "PythonContainer"

[[durable_objects.bindings]]
name = "SUMMARY_CONTAINER"
class_name = "SummaryContainer"

# DOs need a migration to be created the first time. Bumping `tag`
# is how you signal "these classes are new on this deploy" — once
# applied to production the tag must not be reused for the same
# new_sqlite_classes set.
[[migrations]]
tag = "v3-containers"
new_sqlite_classes = ["PythonContainer", "SummaryContainer"]

# Season-mode profiles for Saturdays in-season (`wrangler.peak.toml`)
# and Feb–Jul (`wrangler.offseason.toml`) live alongside this file.
# This file is the "normal" weekday-in-season config and is what a
# bare `wrangler deploy` targets. Swap procedure documented in
# worker/SEASON-MODES.md.
#
# Wrangler environments (`[env.peak]`, etc.) were considered and
# rejected: they deploy to *separate* Workers (`sports-peak`,
# `sports-normal`), not different configs of the same Worker.
# Three separate config files keep all three modes pointing at the
# same `sports` Worker — only the top-level config differs.
