# Offseason mode: Feb–Jul.
#
# Deploy with `wrangler deploy --config wrangler.offseason.toml`.
# See worker/SEASON-MODES.md for swap procedure.
#
# Differences from wrangler.toml:
#   - SEASON_MODE = "offseason"  (containers' sleepAfter = 5m)
#   - max_instances dropped to 2 for both containers
#   - CRON_WARM_ENABLED = "0" (no cron-warm needed; rare misses
#     pay the cold-start tax)
#
# Everything else is identical and intentionally duplicated.

name = "sports"
main = "src/index.tsx"
account_id = "ebe521cb5b561683303b77d32e240ba4"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

[triggers]
crons = ["* * * * *"]

[assets]
directory = "./public"

[[kv_namespaces]]
binding = "LEAGUE_DATA"
id = "649602a55c7048c5ba433bdece6ba731"

[[kv_namespaces]]
binding = "SUMMARY_LAST_UPDATED"
id = "564be97a4ca8419a9ccdc8b0be0f1c3d"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
PYTHON_BASE_URL = "https://python.unseen-university.org"
SUMMARY_BASE_URL = "https://summary.unseen-university.org"
PYTHON_BACKEND = "container"
SUMMARY_BACKEND = "container"
SEASON_MODE = "offseason"
CRON_WARM_ENABLED = "0"
PREWARM_TOP_N = "0"
PREWARM_BASE_URL = "https://sports.unseen-university.org"

[[containers]]
class_name = "PythonContainer"
image = "registry.cloudflare.com/ebe521cb5b561683303b77d32e240ba4/gop-python:slim"
max_instances = 2
instance_type = "standard-2"
constraints = { regions = ["ENAM", "WNAM"] }

[[containers]]
class_name = "SummaryContainer"
image = "registry.cloudflare.com/ebe521cb5b561683303b77d32e240ba4/gop-summary:slim"
max_instances = 2
instance_type = "standard-2"
constraints = { regions = ["ENAM", "WNAM"] }

[[durable_objects.bindings]]
name = "PYTHON_CONTAINER"
class_name = "PythonContainer"

[[durable_objects.bindings]]
name = "SUMMARY_CONTAINER"
class_name = "SummaryContainer"

[[migrations]]
tag = "v3-containers"
new_sqlite_classes = ["PythonContainer", "SummaryContainer"]
